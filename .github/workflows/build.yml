
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GeoKey Touch
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/android-sdk"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          curl -fsSL \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/android-tools.zip"

          unzip -q "$RUNNER_TEMP/android-tools.zip" \
            -d "$RUNNER_TEMP/android-tools"

          mv "$RUNNER_TEMP/android-tools/cmdline-tools" \
            "$SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract application ZIP
        shell: bash
        run: |
          unzip -q -o .github/workflows/GeoKeyTouch-source.zip

          test -f GeoKeyTouch-source/settings.gradle

      - name: Build Debug APK
        working-directory: GeoKeyTouch-source
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoKeyTouch-APK
          path: GeoKeyTouch-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
